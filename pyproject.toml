[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgba"
version = "0.1.0"
requires-python = "==3.12.3"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]
native = [
  "alfworld==0.4.2",
  "jericho==3.3.1",
  "scienceworld==1.2.3",
  "textworld==1.7.0",
]
llm = [
  "accelerate==1.14.0",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.8.0",
  "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
